<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Database - IT Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .database-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .database-header h1 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .database-header p {
            color: #6b7280;
        }

        .customer-search {
            width: min(100%, 360px);
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font: inherit;
        }

        .database-card {
            overflow: hidden;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .database-table-wrap {
            overflow-x: auto;
        }

        .database-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .database-table th,
        .database-table td {
            padding: 15px 18px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
        }

        .database-table th {
            background: #f8fafc;
            color: #4b5563;
            font-size: 13px;
        }

        .database-table tr:last-child td {
            border-bottom: 0;
        }

        .customer-row {
            cursor: pointer;
        }

        .customer-row:hover {
            background-color: #f8fafc;
        }

        .customer-row:focus-within {
            outline: 2px solid #25448f;
            outline-offset: -2px;
        }

        .customer-id-cell {
            color: #6b7280;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        .customer-link {
            color: #1f2937;
            font-weight: 700;
            text-decoration: none;
        }

        .customer-link:focus-visible {
            outline: 2px solid #25448f;
            outline-offset: 3px;
        }

        .customer-row:hover .customer-link {
            text-decoration: underline;
        }

        .database-status {
            padding: 24px;
            color: #6b7280;
            text-align: center;
        }

        .database-status[role="alert"] {
            color: #b42318;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        @media (max-width: 700px) {
            .database-header {
                align-items: stretch;
                flex-direction: column;
            }

            .customer-search {
                width: 100%;
            }

            .database-table th,
            .database-table td {
                padding: 12px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="staff-layout">
        <aside class="staff-sidebar">
            <div class="staff-sidebar-header">
                <button class="staff-menu-toggle" id="staffMenuToggle" type="button" aria-expanded="false" aria-controls="staffNav" aria-label="Open staff menu">
                    <span class="staff-menu-icon" aria-hidden="true"></span>
                </button>
                <div class="staff-brand">IT Support</div>
                <a href="/staff-profile.html" class="staff-profile-button staff-mobile-profile" aria-label="Staff Profile" title="Staff Profile">
                    <span class="staff-profile-icon" aria-hidden="true">👤</span>
                </a>
            </div>
            <nav class="staff-nav" id="staffNav" aria-label="Staff navigation">
                <a href="/staff.html" class="staff-nav-link">Dashboard</a>
                <a href="/customer-database.html" class="staff-nav-link" aria-current="page">Customer Database</a>
                <a href="/staff-profile.html" class="staff-profile-button staff-nav-profile" aria-label="Staff Profile" title="Staff Profile">
                    <span class="staff-profile-icon" aria-hidden="true">👤</span>
                </a>
                <a href="/" class="staff-nav-link staff-logout">Logout</a>
            </nav>
        </aside>

        <main class="container staff-main">
            <header class="database-header">
                <div>
                    <h1>Customer Database</h1>
                    <p>View customer accounts, available credits, and ticket totals.</p>
                </div>
                <label>
                    <span class="visually-hidden">Search customers</span>
                    <input class="customer-search" id="customerSearch" type="search" placeholder="Search ID, name, or email">
                </label>
            </header>

            <section class="database-card" aria-label="Customers">
                <div class="database-table-wrap">
                    <table class="database-table">
                        <thead>
                            <tr>
                                <th scope="col">Customer ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Available Credits</th>
                                <th scope="col">Tickets</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </div>
                <p class="database-status" id="customerDatabaseStatus" role="status" aria-live="polite">Loading customers...</p>
            </section>
        </main>
    </div>
    <script src="/script.js"></script>
    <script src="/customer-database.js"></script>
</body>
</html>
