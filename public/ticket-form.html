<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Ticket - IT Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: #0B2163;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: lightgray;
        }

        .back-link {
            text-decoration: none;
            color: lightgray;
            font-size: 14px;
        }

        .back-link:hover {
            color: #1769aa;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #1769aa;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        #appointmentSection {
            display: none;
            margin-top: 10px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        #appointmentSection h3 {
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #12578c;
        }

        #ticketMessage {
            margin-top: 20px;
            font-size: 14px;
            color: #1769aa;
            text-align: center;
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                margin: 30px auto;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">IT Support</div>
        <a href="/staff.html" class="back-link">← Back to Staff Portal</a>
    </nav>

    <main class="container">
        <div class="form-card">
            <h1>Submit a Support Ticket</h1>
            <p class="subtitle">Record the customer issue and support details for the IT team.</p>

            <form id="ticketForm">
                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="Customer name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Customer email" required>
                </div>

                <div class="form-group">
                    <label for="issue">Describe the issue</label>
                    <textarea id="issue" placeholder="Describe the IT issue the customer is experiencing..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="supportType">Support Type</label>
                    <select id="supportType" required>
                        <option value="">Select support type</option>
                        <option value="Phone Support">Phone Support</option>
                        <option value="Email Support">Email Support</option>
                        <option value="Remote Support">Remote Support</option>
                        <option value="On-site Support">On-site Support</option>
                    </select>
                </div>

                <div id="appointmentSection">
                    <h3>On-site Support Appointment</h3>

                    <div class="form-group">
                        <label for="onSiteSupportType">On-site Support Type</label>
                        <select id="onSiteSupportType">
                            <option value="">Select on-site support type</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Ad Hoc">Ad Hoc</option>
                            <option value="Project">Project</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentDate">Appointment Date</label>
                        <input type="date" id="appointmentDate">
                    </div>

                    <div class="form-group">
                        <label for="appointmentTime">Appointment Time</label>
                        <input type="time" id="appointmentTime">
                    </div>

                    <div class="form-group" id="durationField" style="display: none;">
                        <label id="durationLabel" for="appointmentDuration">Duration (hours)</label>
                        <input type="number" id="appointmentDuration" min="1" step="0.5" placeholder="Select an on-site support type">
                    </div>
                </div>

                <button type="submit">Submit Ticket</button>
                <div id="ticketMessage"></div>
            </form>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
