<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile - IT Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 30px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .profile-header h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .profile-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .info-section h3 {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #6b7280;
            font-size: 14px;
            font-weight: bold;
        }

        .info-value {
            font-size: 14px;
            color: #374151;
        }

        .back-button {
            display: inline-block;
            background: #0B2163;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #25448F;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .edit-button,
        .save-button,
        .cancel-button {
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 20px;
        }

        .edit-button,
        .save-button {
                    background: #0B2163;
            color: white;
        }

        .edit-button:hover,
        .save-button:hover {
                    background: #25448F;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel-button:hover {
            background: #d1d5db;
        }

        .edit-form {
            border-top: 1px solid #e5e7eb;
            margin-top: 25px;
            padding-top: 24px;
        }

        .edit-form h3 {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #1f2937;
            font: inherit;
            font-size: 14px;
            padding: 11px 12px;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #0B2163;
            outline: 2px solid rgba(11, 33, 99, 0.18);
        }

        .form-status {
            color: #9f2d2d;
            font-size: 14px;
            margin: 0 0 16px;
        }

        .form-status:empty {
            display: none;
        }

        .profile-status {
            color: #17623a;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .profile-status:empty {
            display: none;
        }

        @media (max-width: 650px) {
            .page-header {
                display: block;
            }

            .container {
                margin: 30px auto;
            }

            .profile-card {
                padding: 25px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="staff-layout">
        <aside class="staff-sidebar">
            <div class="staff-sidebar-header">
                <button class="staff-menu-toggle" id="staffMenuToggle" type="button" aria-expanded="false" aria-controls="staffNav" aria-label="Open staff menu">
                    <span class="staff-menu-icon" aria-hidden="true"></span>
                </button>
                <div class="staff-brand">IT Support</div>
                <a href="/staff-profile.html" class="staff-profile-button staff-mobile-profile" aria-label="Staff Profile" title="Staff Profile" aria-current="page">
                    <span class="staff-profile-icon" aria-hidden="true">👤</span>
                </a>
            </div>
            <nav class="staff-nav" id="staffNav" aria-label="Staff navigation">
                <a href="/staff.html" class="staff-nav-link">Dashboard</a>
                <a href="/staff-profile.html" class="staff-profile-button staff-nav-profile" aria-label="Staff Profile" title="Staff Profile" aria-current="page">
                    <span class="staff-profile-icon" aria-hidden="true">👤</span>
                </a>
                <a href="/" class="staff-nav-link staff-logout">Logout</a>
            </nav>
        </aside>

        <main class="container staff-main">
        <section class="page-header">
            <h1>Staff Profile</h1>
            <p>View your IT staff account information.</p>
        </section>

        <section class="profile-card">
            <div class="profile-header">
                <div class="profile-icon">👨‍💻</div>
                <div>
                    <h2 id="profileName"></h2>
                    <p id="profileDepartment"></p>
                </div>
            </div>

            <div class="info-section">
                <h3>Account Information</h3>

                <div class="info-row">
                    <div class="info-label">Name</div>
                    <div class="info-value" id="staffName"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Email</div>
                    <div class="info-value" id="staffEmail"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Role</div>
                    <div class="info-value" id="staffRole"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Department</div>
                    <div class="info-value" id="staffDepartment"></div>
                </div>
            </div>

            <p class="profile-status" id="profileStatus" role="status" aria-live="polite"></p>

            <div class="profile-actions">
                <button class="edit-button" id="editProfileButton" type="button" hidden>Edit profile</button>
                <a href="/staff.html" class="back-button">Back to Dashboard</a>
            </div>

            <form class="edit-form" id="editProfileForm" hidden>
                <h3>Edit account details</h3>

                <div class="form-group">
                    <label for="editStaffName">Name</label>
                    <input id="editStaffName" name="name" type="text" maxlength="100" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="currentStaffPassword">Current password</label>
                    <input id="currentStaffPassword" name="currentPassword" type="password" autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="newStaffPassword">New password</label>
                    <input id="newStaffPassword" name="newPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmStaffPassword">Confirm new password</label>
                    <input id="confirmStaffPassword" name="confirmPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password">
                </div>

                <p class="form-status" id="editProfileStatus" role="alert" aria-live="assertive"></p>

                <div class="profile-actions">
                    <button class="save-button" id="saveProfileButton" type="submit">Save changes</button>
                    <button class="cancel-button" id="cancelProfileButton" type="button">Cancel</button>
                </div>
            </form>
        </section>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
