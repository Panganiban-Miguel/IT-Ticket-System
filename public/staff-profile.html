<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile - IT Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: #0B2163;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: lightgray;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            text-decoration: none;
            color: lightgray;
            font-size: 14px;
        }

        .nav-link:hover {
            color: #1769aa;
        }

        .container {
            max-width: 800px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 30px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #eef6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .profile-header h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .profile-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .info-section h3 {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #6b7280;
            font-size: 14px;
            font-weight: bold;
        }

        .info-value {
            font-size: 14px;
            color: #374151;
        }

        .back-button {
            display: inline-block;
            background: #1769aa;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #12578c;
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                margin: 30px auto;
            }

            .profile-card {
                padding: 25px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">IT Support</div>
        <div class="nav-right">
            <a href="/staff.html" class="nav-link">Dashboard</a>
            <a href="/" class="nav-link">Logout</a>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h1>Staff Profile</h1>
            <p>View your IT staff account information.</p>
        </section>

        <section class="profile-card">
            <div class="profile-header">
                <div class="profile-icon">👨‍💻</div>
                <div>
                    <h2 id="profileName">IT Support Staff</h2>
                    <p id="profileDepartment">IT Support Team</p>
                </div>
            </div>

            <div class="info-section">
                <h3>Account Information</h3>

                <div class="info-row">
                    <div class="info-label">Name</div>
                    <div class="info-value" id="staffName">IT Support Staff</div>
                </div>

                <div class="info-row">
                    <div class="info-label">Email</div>
                    <div class="info-value" id="staffEmail">itadmin@company.com</div>
                </div>

                <div class="info-row">
                    <div class="info-label">Role</div>
                    <div class="info-value" id="staffRole">IT Support Staff</div>
                </div>

                <div class="info-row">
                    <div class="info-label">Department</div>
                    <div class="info-value" id="staffDepartment">Information Technology</div>
                </div>
            </div>

            <a href="/staff.html" class="back-button">← Back to Dashboard</a>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
