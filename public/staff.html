<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
        min-height: 100vh;
    }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 30px;
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary-grid {
            grid-template-columns:
                repeat(4, 1fr);
        }

        /* =========================
           TABLE
        ========================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th {
            text-align: left;

            padding: 16px 20px;

            background: #f9fafb;

            color: #6b7280;

            font-size: 13px;

            font-weight: bold;

            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 18px 20px;

            border-bottom: 1px solid #f0f0f0;

            font-size: 14px;
        }

        tr:hover {
            background: #fafcff;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            background: #eef6fc;

            color: #1769aa;

            font-size: 12px;

            font-weight: bold;
        }


        /* =========================
           VIEW BUTTON
        ========================= */

        .view-button {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 7px;

            background: #0B2163;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;
        }

        .view-button:hover {
            background: #0c2a8a;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            text-align: center;

            padding: 65px 25px;
        }

        .empty-state h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .empty-state p {
            color: #6b7280;

            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 650px) {

            .navbar {
                padding: 0 20px;
            }

            .container {
                margin: 30px auto;
            }

            .page-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">
        IT Support
    </div>


    <div class="nav-right">

        <a
            href="/staff-profile.html"
            class="nav-link"
        >
            Staff Profile
        </a>

        <a
            href="/"
            class="nav-link"
        >
            Logout
        </a>

    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- HEADER -->

    <section class="page-header">

        <div>

            <h1>
                IT Dashboard
            </h1>
            <button 
                type="button" 
                class="create-ticket-btn"
                onclick="window.location.href='/ticket-form.html'">
                + Create Ticket
            </button>
            <p>
                Manage and monitor support tickets.
            </p>

        </div>

    </section>



    <!-- =========================
         SUMMARY CARDS
    ========================= -->

    <section class="summary-grid">


        <div class="summary-card">

            <div class="summary-label">
                Total Tickets
            </div>

            <div
                class="summary-number"
                id="totalTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Open
            </div>

            <div
                class="summary-number"
                id="openTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                In Progress
            </div>

            <div
                class="summary-number"
                id="inProgressTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Closed
            </div>

            <div
                class="summary-number"
                id="closedTickets"
            >
                0
            </div>

        </div>


    </section>



    <!-- =========================
         ALL TICKETS
    ========================= -->

    <section class="tickets-card">


        <div class="tickets-header">

            <h2>
                All Tickets
            </h2>

            <span>
                Support requests
            </span>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Ticket ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Issue
                        </th>

                        <th>
                            Support Type
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="ticketTableBody">

                </tbody>

            </table>

        </div>


        <div
            class="empty-state"
            id="emptyState"
            style="display:none;"
        >

            <h3>
                No tickets found
            </h3>

            <p>
                Submitted support tickets will appear here.
            </p>

        </div>


    </section>


</main>


<script src="/script.js"></script>


</body>

</html>
