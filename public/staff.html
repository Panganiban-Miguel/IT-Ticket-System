<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
        min-height: 100vh;
    }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 30px;
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary-grid {
            grid-template-columns:
                repeat(4, 1fr);
        }

        /* =========================
           TABLE
        ========================= */

        .table-container {
            overflow-x: auto;
        }

        .mobile-ticket-list {
            display: none;
        }

        .mobile-ticket-swipe {
            position: relative;
            overflow: hidden;
            background: #b42318;
            border-bottom: 1px solid #e5e7eb;
        }

        .mobile-ticket-delete {
            position: absolute;
            inset: 0 0 0 auto;
            width: 88px;
            border: 0;
            background: #b42318;
            color: white;
            font: inherit;
            font-weight: bold;
        }

        .mobile-ticket-delete:focus-visible {
            outline: 3px solid #111827;
            outline-offset: -4px;
        }

        .mobile-ticket-card {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 88px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            background: white;
            color: #1f2937;
            text-decoration: none;
            touch-action: pan-y;
            transform: translateX(0);
            transition: transform 180ms ease-out;
        }

        .mobile-ticket-card:focus-visible {
            outline: 3px solid #0B2163;
            outline-offset: -3px;
        }

        .mobile-ticket-swipe.is-open .mobile-ticket-card {
            transform: translateX(-88px);
        }

        .mobile-ticket-swipe.is-dragging .mobile-ticket-card {
            transition: none;
        }

        .mobile-ticket-info {
            min-width: 0;
        }

        .mobile-ticket-info strong,
        .mobile-ticket-issue,
        .mobile-ticket-meta {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mobile-ticket-info strong {
            font-size: 14px;
        }

        .mobile-ticket-issue {
            margin-top: 3px;
            font-size: 13px;
        }

        .mobile-ticket-meta {
            margin-top: 4px;
            color: #6b7280;
            font-size: 12px;
        }

        .mobile-ticket-status {
            flex: 0 0 auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th {
            text-align: left;

            padding: 16px 20px;

            background: #f9fafb;

            color: #6b7280;

            font-size: 13px;

            font-weight: bold;

            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 18px 20px;

            border-bottom: 1px solid #f0f0f0;

            font-size: 14px;
        }

        tr:hover {
            background: #fafcff;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            background: #f3f4f6;

            color: #0B2163;

            font-size: 12px;

            font-weight: bold;
        }


        /* =========================
           VIEW BUTTON
        ========================= */

        .view-button {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 7px;

            background: #0B2163;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;
        }

        .view-button:hover {
            background: #25448F;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            text-align: center;

            padding: 65px 25px;
        }

        .empty-state h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .empty-state p {
            color: #6b7280;

            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 650px) {

            .table-container {
                display: none;
            }

            .mobile-ticket-list {
                display: block;
            }

            .container {
                margin: 30px auto;
            }

            .page-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }

            .create-ticket-btn {
                display: block;
                width: 100%;
                padding: 16px 20px;
                font-size: 17px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .summary-card {
                aspect-ratio: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 12px;
                text-align: center;
            }

            .summary-label {
                margin-bottom: 8px;
            }

        }

        @media (max-width: 480px) {

            .tickets-card th:first-child,
            .tickets-card td:first-child {
                display: none;
            }

        }

    </style>

</head>

<body>


<div class="staff-layout">
    <aside class="staff-sidebar">
        <div class="staff-sidebar-header">
            <button class="staff-menu-toggle" id="staffMenuToggle" type="button" aria-expanded="false" aria-controls="staffNav" aria-label="Open staff menu">
                <span class="staff-menu-icon" aria-hidden="true"></span>
            </button>
            <div class="staff-brand">IT Support</div>
            <a href="/staff-profile.html" class="staff-profile-button staff-mobile-profile" aria-label="Staff Profile" title="Staff Profile">
                <span class="staff-profile-icon" aria-hidden="true">👤</span>
            </a>
        </div>
        <nav class="staff-nav" id="staffNav" aria-label="Staff navigation">
            <a href="/staff.html" class="staff-nav-link" aria-current="page">Dashboard</a>
            <a href="/staff-profile.html" class="staff-profile-button staff-nav-profile" aria-label="Staff Profile" title="Staff Profile">
                <span class="staff-profile-icon" aria-hidden="true">👤</span>
            </a>
            <a href="/" class="staff-nav-link staff-logout">Logout</a>
        </nav>
    </aside>

    <main class="container staff-main">


    <!-- HEADER -->

    <section class="page-header">

        <div>

            <h1>
                IT Dashboard
            </h1>
            <button 
                type="button" 
                class="create-ticket-btn"
                onclick="window.location.href='/ticket-form.html'">
                + Create Ticket
            </button>
            <p>
                Manage and monitor support tickets.
            </p>

        </div>

    </section>



    <!-- =========================
         SUMMARY CARDS
    ========================= -->

    <section class="summary-grid">


        <div class="summary-card">

            <div class="summary-label">
                Total Tickets
            </div>

            <div
                class="summary-number"
                id="totalTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Open
            </div>

            <div
                class="summary-number"
                id="openTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                In Progress
            </div>

            <div
                class="summary-number"
                id="inProgressTickets"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Closed
            </div>

            <div
                class="summary-number"
                id="closedTickets"
            >
                0
            </div>

        </div>


    </section>



    <!-- =========================
         ALL TICKETS
    ========================= -->

    <section class="tickets-card">


        <div class="tickets-header">

            <h2>
                All Tickets
            </h2>

            <span>
                Support requests
            </span>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Ticket ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Issue
                        </th>

                        <th>
                            Support Type
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="ticketTableBody">

                </tbody>

            </table>

        </div>

        <div class="mobile-ticket-list" id="mobileTicketList"></div>


        <div
            class="empty-state"
            id="emptyState"
            style="display:none;"
        >

            <h3>
                No tickets found
            </h3>

            <p>
                Submitted support tickets will appear here.
            </p>

        </div>


    </section>


</main>
</div>


<script src="/ticket-metrics.js"></script>
<script src="/script.js"></script>


</body>

</html>
