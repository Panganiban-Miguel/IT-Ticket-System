<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Database | IT Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .staff-database-header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; }
        .staff-directory-card { background:white; border-radius:12px; padding:20px; box-shadow:0 2px 12px #0b216310; }
        .staff-entry { border:1px solid #e5e7eb; border-radius:8px; margin:12px 0; padding:14px; }
        .staff-entry > summary { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.75fr); gap: 12px; align-items: center; }
        .staff-entry-name { text-align: left; min-width: 0; overflow-wrap: anywhere; }
        .staff-entry-role { text-align: left; color: #4b5563; font-weight: 400; min-width: 0; overflow-wrap: anywhere; }
        .staff-entry-status { text-align: right; color: #15803d; font-weight: 400; min-width: 0; overflow-wrap: anywhere; }
        .staff-entry.inactive .staff-entry-status { color: #dc2626; }
        .staff-entry.inactive { opacity:.72; }
        .staff-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:16px; }
        .staff-detail-grid section { background:#f8fafc; border-radius:8px; padding:14px; display:flex; flex-direction:column; }
        .staff-detail-grid h3 { margin:0 0 10px; color:#0b2163; font-size:1rem; }
        .staff-detail-grid ul { padding-left:20px; margin:0; }
        .staff-detail-grid li { margin:8px 0; overflow-wrap:anywhere; }
        .staff-detail-grid ul { flex:1; }
        .appointment-list { display:grid; gap:8px; }
        .appointment-card { border:1px solid #dbe3ef; border-radius:8px; background:#fff; }
        .appointment-card summary { cursor:pointer; padding:11px 12px; color:#1f2937; font-weight:600; overflow-wrap:anywhere; }
        .appointment-assignment-form { padding:0 12px 12px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
        .appointment-assignment-form select { min-width:0; }
        .appointment-assignment-form button { padding:9px 13px; border:0; border-radius:6px; background:#0b2163; color:white; cursor:pointer; }
        .appointment-assignment-form button:disabled { cursor:not-allowed; opacity:.55; }
        .staff-form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
        .staff-entry form { margin-top:14px; }
        .staff-entry input,.staff-entry select { width:100%; padding:9px; }
        .staff-actions { display:flex; gap:8px; margin-top:10px; }
        .staff-actions button,.staff-database-header button { padding:9px 13px; border:0; border-radius:6px; background:#0b2163; color:white; cursor:pointer; }
        .staff-detail-grid section > button { align-self:flex-start; padding:9px 13px; border:0; border-radius:6px; background:#0b2163; color:white; cursor:pointer; margin-top:10px; }
        .staff-detail-grid button:disabled { cursor:not-allowed; opacity:.55; }
        .staff-add-form { display:none; gap:8px; }
        .staff-add-form.is-open { display:grid; }
        .staff-add-form button { padding:9px 13px; border:0; border-radius:6px; background:#0b2163; color:white; cursor:pointer; }
        .staff-add-form [hidden] { display:none; }
        .staff-actions .secondary { background:#64748b; }
        .staff-status { min-height:1.5em; }
        #newStaffForm { display:none; margin-bottom:18px; }
        .unassigned-appointment { color:#9a3412; }
    </style>
</head>
<body>
    <div class="staff-layout">
        <aside class="staff-sidebar">
            <div class="staff-sidebar-header">
                <button class="staff-menu-toggle" id="staffMenuToggle" type="button" aria-expanded="false" aria-controls="staffNav" aria-label="Open staff menu"><span class="staff-menu-icon" aria-hidden="true"></span></button>
                <div class="staff-brand">IT Support</div>
                <a href="/staff-profile.html" class="staff-profile-button staff-mobile-profile" aria-label="Staff Profile" title="Staff Profile"><span class="staff-profile-icon" aria-hidden="true">👤</span></a>
            </div>
            <nav class="staff-nav" id="staffNav" aria-label="Staff navigation">
                <a href="/staff.html" class="staff-nav-link">Dashboard</a>
                <a href="/staff-database.html" class="staff-nav-link" aria-current="page">Staff</a>
                <a href="/customer-database.html" class="staff-nav-link">Customer</a>
                <a href="/staff-profile.html" class="staff-profile-button staff-nav-profile" aria-label="Staff Profile" title="Staff Profile"><span class="staff-profile-icon" aria-hidden="true">👤</span></a>
                <a href="/" class="staff-nav-link staff-logout">Logout</a>
            </nav>
        </aside>
        <main class="container staff-main">
            <header class="staff-database-header">
                <div>
                    <h1>Staff Database</h1>
                    <p>Manage staff records, assignments, and technician appointments.</p>
                </div>
                <button id="addStaffButton" type="button">+ Add Staff</button>
            </header>
            <p class="staff-status" id="staffDatabaseStatus" role="status" aria-live="polite">Loading staff...</p>
            <section class="staff-directory-card" id="newStaffForm">
                <h2>Add Staff Member</h2>
                <form id="createStaffForm">
                    <div class="staff-form-grid">
                        <label>Name<input name="name" maxlength="120" required></label>
                        <label>Role<input name="role" maxlength="80" required placeholder="Technician, Engineer, etc."></label>
                        <label>Department<input name="department" maxlength="120"></label>
                        <label>Email<input name="email" type="email" maxlength="254"></label>
                        <label>Phone<input name="phone" type="tel" maxlength="40"></label>
                        <label>Login account (optional)<select name="loginStaffId" id="newLoginStaffId"></select></label>
                    </div>
                    <div class="staff-actions"><button type="submit">Create Staff Record</button><button class="secondary" id="cancelAddStaff" type="button">Cancel</button></div>
                </form>
            </section>
            <section class="staff-directory-card" aria-label="Staff directory" id="staffDirectory"></section>
            <section class="staff-directory-card" aria-label="Unassigned visits">
                <h2>Visits Requiring Scheduling</h2>
                <div id="unassignedAppointments">Loading appointments...</div>
            </section>
        </main>
    </div>
    <script src="/script.js"></script>
    <script src="/staff-database.js"></script>
</body>
</html>
