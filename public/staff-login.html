<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Login - IT Support</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #1f2937;
    }

    .login-container {
        width: 420px;
        max-width: 90%;

        background: white;

        padding: 40px;

        border-radius: 16px;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
        text-align: center;

        font-size: 25px;
        font-weight: bold;

        color: #0B2163;

        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;

        color: #6b7280;

        font-size: 14px;

        margin-bottom: 35px;
    }

    h2 {
        font-size: 22px;

        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;

        font-size: 14px;
        font-weight: bold;

        margin-bottom: 8px;
    }

    input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #d1d5db;

        border-radius: 8px;

        font-size: 14px;

        outline: none;
    }

    input:focus {
        border-color: #1769aa;
    }

    button {
        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #1769aa;

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #12578c;
    }

    .back-link {
        display: block;

        text-align: center;

        margin-top: 22px;

        color: #6b7280;

        text-decoration: none;

        font-size: 14px;
    }

    .back-link:hover {
        color: #1769aa;
    }

</style>

</head>

<body>

<div class="login-container">


<div class="logo">
    IT Support
</div>

<div class="subtitle">
    Staff Portal
</div>

<h2>
    Staff Login
</h2>

<form id="staffLoginForm">

    <div class="form-group">

        <label for="staffEmail">
            Email
        </label>

        <input
            type="email"
            id="staffEmail"
            placeholder="Enter your email"
            required
        >

    </div>

    <div class="form-group">

        <label for="staffPassword">
            Password
        </label>

        <input
            type="password"
            id="staffPassword"
            placeholder="Enter your password"
            required
        >

    </div>

    <button type="submit">
        Login
    </button>

</form>

<a
    href="/"
    class="back-link"
>
    ← Back to main page
</a>


</div>

<script src="/script.js"></script>

</body>

</html>
